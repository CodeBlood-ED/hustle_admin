@if (authService.isAdmin()) {
  <header class="admin-nav">
    <div class="nav-left">
      <a routerLink="/products" class="brand">Hustle<span>.</span></a>
      <span class="badge">ADMIN</span>
      <nav class="nav-links">
        <a routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">All Products</a>
        <a routerLink="/upload_product" routerLinkActive="active">Upload Product</a>
      </nav>
    </div>
    <div class="nav-right">
      <span class="user-info">{{ authService.currentUser()?.email }}</span>
      <button type="button" class="logout-btn" (click)="onLogout()">Log Out</button>
    </div>
  </header>
}

<main class="main-content" [class.with-nav]="authService.isAdmin()">
  <router-outlet></router-outlet>
</main>
